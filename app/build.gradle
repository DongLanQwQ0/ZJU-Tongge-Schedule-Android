plugins { id 'com.android.application' }

android {
    namespace 'com.tongge.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tongge.app'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            // Preserve upgrade compatibility with APKs already delivered to the user.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
