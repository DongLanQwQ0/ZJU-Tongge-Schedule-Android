plugins { id 'com.android.application' }

android {
    namespace 'com.tongge.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tongge.app'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.0.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            // Preserve upgrade compatibility with APKs already delivered to the user.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // ZXing's published POM omits the ContextCompat/ActivityCompat runtime dependency.
    implementation 'androidx.core:core:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
